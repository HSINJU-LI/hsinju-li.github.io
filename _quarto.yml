project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - about.qmd
    - posts.qmd
    - projects.qmd
    - resources.qmd
    - "!original-backup-*/"
    - "posts/*/index.qmd"
    - "projects/*/index.qmd"

website:
  title: "Hsin-Ju Li"
  description: "Ph.D. candidate at UC Santa Barbara specializing in remote sensing, imaging spectroscopy, and environmental change."
  site-url: https://hsinju-li.github.io/
  open-graph: true
  favicon: /media/Tree_of_Life.png
  navbar:
    title: "Hsin-Ju Li"
    logo: /media/Tree_of_Life.svg
    logo-alt: "logo of tree of life"
    right:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: projects.qmd
        text: Research
      - posts.qmd
      - href: resources.qmd
        text: Resources
      - href: media/CV_HsinJuLi.pdf # providing a relative file path to a pdf will open up a browser-based pdf viewer when clicked
        text: CV
        target: _blank
  page-footer:
    background: light # or `dark`
    left: Copyright 2026, Hsin-Ju Li
    right: This website is built with [{{< fa brands github title="GitHub octocat logo" >}}](https://github.com/HSINJU-LI/hsinju-li.github.io){target=_blank} and [Quarto](https://quarto.org/){target=_blank}


format:
  html:
    theme:
      - cosmo
      - styles.scss
    mainfont: Nunito Sans
    toc: true
    page-layout: article



